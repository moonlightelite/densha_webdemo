<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Densha de Go! — Yamanote Web Demo</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #canvas { width: 100vw; height: 100vh; display: block; background: #000; outline: none; }
  #status {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    font: 13px/1.4 monospace; color: #9fd; background: rgba(0,0,0,.75);
    padding: 6px 10px; white-space: pre-wrap; pointer-events: none;
  }
  #status.done { display: none; }
  #autodrive {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; font: bold 15px monospace; color: #fff;
    background: rgba(0,0,0,.65); border: 1px solid #6cf; border-radius: 6px;
    padding: 5px 14px; display: none; pointer-events: none;
  }
  #autodrive.off { border-color: #f96; color: #fca; }
  #gfxq {
    position: fixed; top: 112px; left: 50%; transform: translateX(-50%);
    z-index: 10; font: bold 15px monospace; color: #fff;
    background: rgba(0,0,0,.65); border: 1px solid #9f9; border-radius: 6px;
    padding: 5px 14px; display: none; pointer-events: none;
  }
  #fpsmode {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    z-index: 10; font: bold 15px monospace; color: #fff;
    background: rgba(0,0,0,.65); border: 1px solid #6cf; border-radius: 6px;
    padding: 4px 12px; display: none;
  }
  #audiogate {
    position: fixed; top: 48px; left: 50%; transform: translateX(-50%);
    z-index: 11; font: bold 15px monospace; color: #ffd;
    background: rgba(0,0,0,.8); border: 1px solid #fd6; border-radius: 6px;
    padding: 8px 18px; display: none; pointer-events: none;
  }
  /* The intro-card overlay: the education subtitle + the controls-page
     affordance, shown while the game's start-of-run intro card ("Yamanote
     Line  Diagram  01" banner) is on screen (dgf_intro_state bit 24). The
     link must stay clickable — the container stays pointer-events:none and
     only the link re-enables it (the canvas keeps the keyboard focus). */
  #introsub {
    position: fixed; left: 0; right: 0; bottom: 64px; z-index: 10;
    text-align: center; font: 13px/1.6 monospace; color: #cde;
    background: rgba(0,0,0,.6); padding: 8px 12px; display: none;
    pointer-events: none;
  }
  #introsub a {
    color: #9fd; pointer-events: auto; margin-left: 14px;
    text-decoration: underline;
  }
  #introsub a:hover { color: #fff; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="autodrive"></div>
<div id="fpsmode"></div>
<div id="gfxq"></div>
<div id="audiogate">🔊 Click the page or press any key to enable audio</div>
<!-- The intro-card overlay: gated on the game's startdemo state (bit 24 of
     dgf_intro_state) — visible exactly while the "Yamanote Line Diagram 01"
     intro card is on screen. The link opens web/controls.html (the keyboard
     guide) in a new tab so the running demo is not torn down; the guide's
     back button returns to continue the game. -->
<div id="introsub">Web demo compiled by moonlightelite. For education purpose only.<a href="controls.html" target="_blank" rel="noopener">Keyboard controls ▸</a></div>
<div id="status">Loading… (build 6d62481d — first load fetches the asset pack once)</div>
<script>
  // Args: /data = the preloaded asset root; -autostart drops straight into
  // Yamanote Diagram #1; -undead keeps the demo run alive while you learn
  // the brakes. Diagnostics: ?boot=<autostart arg> overrides the boot target;
  // ?menu=<DGF_MENU_STEP value> boots a seeded menu screen instead (e.g.
  // ?menu=Result:Run:6:1000 — the Get Credit result screen).
  // ?tp=<chain metres> one-shot jumps the run to that loop-chain position at
  // departure (the DGF_TELEPORT audit knob, read as -teleport= — the web
  // build cannot setenv); ?fast=1 runs the fixed 100 ms sim lane.
  var bootArgs = ['-undead', '/data', '-480', '-autostart=0:1'];
  var bootEnv = { DGF_DEPART_DBG: '1', DGF_DEBUG_KEYS: '1' };
  try {
    var qs = new URLSearchParams(location.search);
    var bootQ = qs.get('boot');
    if (bootQ) bootArgs[3] = '-autostart=' + bootQ;
    var menuQ = qs.get('menu');
    if (menuQ) {
      bootArgs = ['-undead', '/data', '-480'];
      // Module.ENV is inert on this emcc (getenv never sees it); the seed
      // rides in as a -menustep= argument instead (main.cpp reads argv).
      bootArgs.push('-menustep=' + menuQ);
      bootEnv.DGF_MENU_STEP = menuQ;
    }
    // ?env=NAME:VALUE[,NAME:VALUE…] passes extra game env (diagnostics).
    // Module.ENV is inert on this emcc (getenv never sees it), so the keys
    // also ride on argv as -env=… (main.cpp setenvs them before the
    // diagnostics' static init).
    var envQ = qs.get('env');
    if (envQ) {
      bootArgs.push('-env=' + envQ);
      envQ.split(',').forEach(function (kv) {
        var c = kv.indexOf(':');
        if (c > 0) bootEnv[kv.slice(0, c)] = kv.slice(c + 1);
      });
    }
    // ?probe=1 enables the game-side web probes (the wasm reads
    // it from argv — Module.ENV extra keys do not reach getenv in this build).
    if (qs.get('probe') === '1') bootArgs.push('-webprobe');
    // ?audio=1 enables the mixer's [audio] event log (voice starts/stops) on
    // the browser console — the source-level side of the audio diagnosis.
    if (qs.get('audio') === '1') bootArgs.push('-webaudio');
    // ?fast=1 runs the simulation on the fixed 100 ms lane (DGF_FIXED_DT_MS):
    // ~5x real-time on the software renderer, for the end-to-end verification.
    if (qs.get('fast') === '1') bootArgs.push('-webfast');
    // ?walkdbg=1 logs the station-result walk's step transitions ([walk]
    // lines) on the browser console.
    if (qs.get('walkdbg') === '1') bootArgs.push('-walkdbg');
    // ?aidbg=1 logs the AI lookahead's view every 120 sim frames ([aidbg]
    // lines) on the browser console — the frame-rate-independence A/B lane
    // (the sim timeline sampled at a fixed SIM cadence).
    if (qs.get('aidbg') === '1') bootArgs.push('-webaidbg');
    // ?tp=<chain metres> one-shot jumps the run to that loop-chain position
    // (the DGF_TELEPORT audit knob; the web build reads it as -teleport=).
    var tpQ = qs.get('tp');
    if (tpQ) bootArgs.push('-teleport=' + tpQ);
  } catch (e) {}
  // WebGL2 capability probe. The build is -sMIN_WEBGL_VERSION=2 (the ES3
  // renderer needs #version 300 es shaders + glBlitFramebuffer), so a host
  // without a WebGL2 provider cannot run the demo. Firefox on a display-less
  // host (pure --headless with no X server) has NO GL provider at all
  // (glxtest fails -> the GL blocklist kicks in) and used to die on context
  // creation with a silent black canvas. Detect that up front and say so in
  // the status bar instead.
  var noWebGL2 = false;
  try {
    var probeGL = null;
    try { probeGL = document.createElement('canvas').getContext('webgl2'); } catch (e) {}
    noWebGL2 = !probeGL;
  } catch (e) {}
  var glFailMsg = 'This demo needs WebGL2, which this browser does not provide. '
    + 'Firefox/Chrome on a machine with a GPU (or software GL) work; a '
    + 'display-less Firefox (--headless with no X server) has no GL provider — '
    + 'run it under xvfb-run instead.';
  if (noWebGL2) {
    window.__dgfNoWebGL2 = true;
    var el0 = document.getElementById('status');
    if (el0) { el0.classList.remove('done'); el0.textContent = glFailMsg; }
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    arguments: bootArgs,
    ENV: bootEnv,
    // The cache-bust: propagate the page's query (?v=...) to the wasm/data
    // sub-resource fetches — the older serve instances did not send
    // no-store, so a browser can hold a stale dgf.wasm/dgf_packN.data under the
    // bare URLs; with this, every fresh ?v= refetches everything.
    locateFile: function (p) { return p + (location.search || ''); },
    print: function (t) {
      console.log(t);
      // The runtime asserts (and aborts) on pre-init exported calls; the
      // game's own loop-start line is the safe "exports are live" signal.
      if (String(t).indexOf('Main loop started') === 0) window.__dgfReady = true;
    },
    printErr: function (t) { console.warn(t); },
    // Surface aborts in the status bar too — a context-creation failure or a
    // runtime trap must not leave a silent black canvas.
    onAbort: function (what) {
      var msg = window.__dgfNoWebGL2 ? glFailMsg : ('The demo aborted: ' + what);
      try {
        statusEl.classList.remove('done');
        statusEl.textContent = msg;
      } catch (e) {}
    },
    setStatus: null,
  };
  var statusEl = document.getElementById('status');
  // The main asset pack rides in the dgf_packN.* bundles (build.sh splits
  // assets/data into GitHub-Pages-safe files — a single >100 MB pack would be
  // LFS-pointerized on push and Pages would serve the pointer verbatim).
  // dgf_packs.js (generated by build.sh) script-writes every bundle loader
  // HERE, before dgf.js runs — same preload-registration position the
  // dgf_extra tag below uses.
  document.write('<script src="dgf_packs.js' + (location.search || '') + '"><\/script>');
  // The optional second asset package (web/dgf_extra.data, tools/extract_extra_assets.sh): the map sets and scenery archives
  // of the Yamanote diagrams outside the bundled slice (every ?boot=0:ROW except rows 1 and 4). Written as a script tag
  // here so it registers its preload before dgf.js runs; ?extra=1 / ?extra=0 force it on / off.
  try {
    var xq = new URLSearchParams(location.search), xb = xq.get('boot'), xm = xb && /^(\d+):(\d+)$/.exec(xb);
    var needExtra = xm ? !(Number(xm[1]) === 0 && (Number(xm[2]) === 1 || Number(xm[2]) === 4)) : false;
    if (xq.get('extra') === '1') needExtra = true;
    if (xq.get('extra') === '0') needExtra = false;
    if (needExtra) {
      document.write('<script src="dgf_extra.js' + (location.search || '') + '"><\/script>');
      document.getElementById('status').textContent = 'Loading… (this diagram needs the extra asset pack)';
    }
  } catch (e) {}
  // ?fsopen=1 (audit): log every file open the game makes ("O: path", and "OF: path" for the ones that fail,
  // i.e. the files a diagram needs that the bundle lacks) - the data-need trace tools/extract_extra_assets.sh reads.
  try {
    if (new URLSearchParams(location.search).get('fsopen') === '1') {
      (Module.preRun = Module.preRun || []).push(function () {
        var F = Module.FS, orig = F.open;
        F.open = function (p, fl, m) {
          try { var r = orig.call(F, p, fl, m); console.log('O: ' + p); return r; }
          catch (e) { console.log('OF: ' + p); throw e; }
        };
      });
    }
  } catch (e) {}
  // WebGL context loss must never be a silent black canvas: surface it in
  // the status bar. The context is not restored — the run ends visibly with
  // the reason instead of freezing.
  try {
    document.getElementById('canvas').addEventListener('webglcontextlost', function (ev) {
      ev.preventDefault();
      try {
        statusEl.classList.remove('done');
        statusEl.textContent = 'The WebGL context was lost — reload the page to drive again.';
      } catch (e) {}
    }, false);
  } catch (e) {}
  Module.setStatus = function (t) {
    if (!t) { statusEl.classList.add('done'); return; }
    statusEl.classList.remove('done');
    statusEl.textContent = t;
  };
  window.addEventListener('keydown', function () { Module.canvas.focus(); }, { once: true });
  Module.canvas.focus();
  // Browsers start AudioContexts suspended until a user gesture. Emscripten's
  // OpenAL backend keeps its contexts in window.AL.contexts[*].audioCtx (the
  // old Module.audioContext handle never exists in this build), so walk that
  // on every gesture and resume whatever is suspended.
  function alContexts() {
    var out = [];
    try {
      var al = window.AL;
      if (al && al.contexts) for (var id in al.contexts) if (al.contexts[id].audioCtx) out.push(al.contexts[id].audioCtx);
    } catch (e) {}
    if (!out.length && Module.audioContext) out.push(Module.audioContext);
    return out;
  }
  function resumeAudio() {
    var cs = alContexts();
    for (var i = 0; i < cs.length; ++i) {
      if (cs[i].state === 'suspended') cs[i].resume();
    }
    updateAudioBadge();
  }
  window.addEventListener('keydown', resumeAudio);
  window.addEventListener('pointerdown', resumeAudio);
  // The audio affordance: a badge while the context is suspended ("click /
  // press any key"), hidden once the context runs.
  var audioBadge = document.getElementById('audiogate');
  function updateAudioBadge() {
    if (!audioBadge) return;
    var cs = alContexts();
    var suspended = true;
    for (var i = 0; i < cs.length; ++i) if (cs[i].state !== 'suspended') suspended = false;
    audioBadge.style.display = (cs.length && suspended) ? 'block' : 'none';
    if (!cs.length) audioBadge.style.display = 'none';
  }
  // The OpenAL contexts can appear after boot, so keep the badge current.
  var audioBadgePoll = setInterval(updateAudioBadge, 2000);
  window.addEventListener('beforeunload', function () { clearInterval(audioBadgePoll); });
  // Autodrive mode hint: the game exports dgf_autodrive_state() (bit 0 = the
  // flag, bits 8..15 = the hint frames remaining — the "a" key sets it for
  // ~2 s per toggle). The overlay shows the mode while the timer runs.
  var adEl = document.getElementById('autodrive');
  function pollAutodrive() {
    // Wait for the game's loop-start print (window.__dgfReady, set in the
    // print handler): calling the export earlier asserts and aborts.
    if (window.__dgfReady && Module._dgf_autodrive_state) {
      var s = Module._dgf_autodrive_state();
      var on = (s & 1) !== 0;
      var hint = (s >> 8) & 0xff;
      if (hint > 0) {
        adEl.textContent = on ? 'AUTO DRIVE ON' : 'AUTO DRIVE OFF — manual (1-5 notches, [ ] brakes)';
        adEl.classList.toggle('off', !on);
        adEl.style.display = 'block';
      } else {
        adEl.style.display = 'none';
      }
    }
    requestAnimationFrame(pollAutodrive);
  }
  requestAnimationFrame(pollAutodrive);
  // Framerate mode hint: the game exports dgf_fps_state() (bit 0 = the
  // uncapped flag, bits 8..15 = the hint frames remaining — the "f" key
  // cycles the modes: 60 fps locked (the default) ↔ uncapped, ~2 s of hint
  // per toggle). Same mechanism as the autodrive overlay.
  var fpsEl = document.getElementById('fpsmode');
  function pollFps() {
    if (window.__dgfReady && Module._dgf_fps_state) {
      var s = Module._dgf_fps_state();
      var uncapped = (s & 1) !== 0;
      var hint = (s >> 8) & 0xff;
      if (hint > 0) {
        fpsEl.textContent = uncapped ? 'FPS: uncapped' : 'FPS: 60 (locked)';
        fpsEl.style.display = 'block';
      } else {
        fpsEl.style.display = 'none';
      }
    }
    requestAnimationFrame(pollFps);
  }
  requestAnimationFrame(pollFps);
  // Graphics quality hint: the game exports dgf_gfxq_state() (bits 0..7 =
  // the level 0/1/2 = Normal/Good/Best, bits 8..15 = the hint frames
  // remaining — the "g" key sets it for ~2 s per press). Same mechanism as
  // the autodrive/fps overlays.
  var gfxEl = document.getElementById('gfxq');
  function pollGfxq() {
    if (window.__dgfReady && Module._dgf_gfxq_state) {
      var s = Module._dgf_gfxq_state();
      var level = s & 0xff;
      var hint = (s >> 8) & 0xff;
      if (hint > 0) {
        gfxEl.textContent = 'Graphics: ' + (level === 1 ? 'Good' : level === 2 ? 'Best' : 'Normal') + '  (g to cycle)';
        gfxEl.style.display = 'block';
      } else {
        gfxEl.style.display = 'none';
      }
    }
    requestAnimationFrame(pollGfxq);
  }
  requestAnimationFrame(pollGfxq);
  // Intro-card overlay: the game exports dgf_intro_state() (bit 0 = the
  // startdemo active flag, bits 8..15 = the phase, bits 16..23 = the
  // playDemo mode, bit 24 = the "Yamanote Line  Diagram  01" banner is on
  // screen). The overlay (the education subtitle + the controls-page link)
  // shows exactly while the banner does — same export-poll pattern as the
  // autodrive/fps/gfxq overlays above.
  var introEl = document.getElementById('introsub');
  function pollIntro() {
    if (window.__dgfReady && Module._dgf_intro_state) {
      var s = Module._dgf_intro_state();
      introEl.style.display = (s & 0x1000000) ? 'block' : 'none';
    }
    requestAnimationFrame(pollIntro);
  }
  requestAnimationFrame(pollIntro);
</script>
{{{ SCRIPT }}}
</body>
</html>
